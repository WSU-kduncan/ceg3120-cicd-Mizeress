name: Lint HTML and CSS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 1. Lint HTML
      - name: Run HTMLHint
        run: |
          npx htmlhint "**/*.html"

      # 2. Lint CSS
      - name: Run Stylelint
        run: |
          npx stylelint "**/*.css"
